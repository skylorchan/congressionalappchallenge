# Downloads the raw datasets and the Oʻahu basemap on a GitHub runner (which has open
# internet access) and commits them to data/raw/ on the same branch.
# Then, locally: `npm run data:build` to produce public/data/.
name: Fetch raw data

on:
  workflow_dispatch:
    inputs:
      refresh_basemap:
        description: Download a fresh basemap even if one is already committed
        type: boolean
        default: false
  push:
    paths:
      - scripts/data/fetch-raw.mjs
      - .github/workflows/fetch-data.yml

permissions:
  contents: write

concurrency:
  group: fetch-data-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc

      - name: Datasets
        run: node scripts/data/fetch-raw.mjs

      - name: Walkable network (OpenStreetMap via Geofabrik, roads and paths on Oʻahu)
        continue-on-error: true
        run: |
          set -euo pipefail
          sudo apt-get install -y -qq osmium-tool > /dev/null
          URL=https://download.geofabrik.de/north-america/us/hawaii-latest.osm.pbf
          curl -sSfL "$URL" -o /tmp/hi.pbf
          osmium extract -b -158.33,21.22,-157.6,21.75 /tmp/hi.pbf -o /tmp/oahu.pbf --overwrite
          osmium tags-filter /tmp/oahu.pbf w/highway -o /tmp/oahu-hw.pbf --overwrite
          osmium export /tmp/oahu-hw.pbf -f geojsonseq --geometry-types=linestring \
            -a type,id -o /tmp/walk.geojsonseq --overwrite
          mkdir -p data/raw/meta
          gzip -9 -c /tmp/walk.geojsonseq > data/raw/osm-walk.geojsonseq.gz
          osmium fileinfo -e /tmp/hi.pbf > data/raw/meta/osm-walk-fileinfo.txt
          printf '{"url":"%s","retrieved":"%s","license":"ODbL, (c) OpenStreetMap contributors"}\n' \
            "$URL" "$(date -u +%FT%TZ)" > data/raw/meta/osm-walk-source.json
          ls -la data/raw/osm-walk.geojsonseq.gz
          grep -iE "timestamp|Number of ways" data/raw/meta/osm-walk-fileinfo.txt | head

      - name: Basemap (Protomaps / OpenStreetMap extract for Oʻahu)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # The basemap is 11 MB; don't re-commit it on every run unless asked.
          if [ -f data/raw/basemap/oahu.pmtiles ] && [ "${{ inputs.refresh_basemap }}" != "true" ]; then
            echo "Basemap already present, skipping"; exit 0
          fi
          mkdir -p data/raw/basemap
          gh release download -R protomaps/go-pmtiles -p '*Linux_x86_64.tar.gz' -O /tmp/pmtiles.tgz
          tar -xzf /tmp/pmtiles.tgz -C /tmp pmtiles
          curl -sSf https://build-metadata.protomaps.dev/builds.json -o /tmp/builds.json
          KEY=$(jq -r 'map(.key) | sort | last' /tmp/builds.json)
          echo "Using build $KEY"
          printf '{"build":"%s","url":"https://build.protomaps.com/%s","retrieved":"%s"}\n' \
            "$KEY" "$KEY" "$(date -u +%FT%TZ)" > data/raw/basemap/source.json
          /tmp/pmtiles extract "https://build.protomaps.com/$KEY" data/raw/basemap/oahu.pmtiles \
            --bbox=-158.33,21.22,-157.6,21.75 --maxzoom=15
          /tmp/pmtiles show data/raw/basemap/oahu.pmtiles > data/raw/basemap/show.txt
          ls -la data/raw/basemap

      - name: Basemap fonts and sprites (protomaps/basemaps-assets)
        continue-on-error: true
        run: |
          set -euo pipefail
          if [ -d data/raw/basemap/fonts ] && [ "${{ inputs.refresh_basemap }}" != "true" ]; then
            echo "Fonts already present, skipping"; exit 0
          fi
          BASE=https://raw.githubusercontent.com/protomaps/basemaps-assets/main
          for font in "Noto Sans Regular" "Noto Sans Medium" "Noto Sans Italic"; do
            mkdir -p "data/raw/basemap/fonts/$font"
            for range in 0-255 256-511 512-767 7680-7935 8192-8447; do
              curl -sSf "$BASE/fonts/${font// /%20}/$range.pbf" -o "data/raw/basemap/fonts/$font/$range.pbf"
            done
          done
          mkdir -p data/raw/basemap/sprites
          for f in light.json light.png light@2x.json light@2x.png; do
            curl -sSf "$BASE/sprites/v4/$f" -o "data/raw/basemap/sprites/$f"
          done
          curl -sSf "$BASE/LICENSE" -o data/raw/basemap/ASSETS-LICENSE.txt || true

      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/raw
          git commit -m "Fetch raw data $(date -u +%F)" || { echo 'No changes'; exit 0; }
          git push
